openapi: 3.1.0
info:
  title: 'Web-block openapi'
  license:
    name: MIT
    identifier: MIT
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000/'
    description: 'Backend server'
paths:
  /api/login:
    post:
      tags:
        - auth
      summary: 'Handle an incoming authentication request.'
      operationId: bc76a9d52929cab7a147ca7b5c527430
      requestBody:
        description: 'Login the user'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: 'User successfully logged in and token issued.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: 'Error with login credentials.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
        '422':
          description: 'Validation error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
  /api/logout:
    delete:
      tags:
        - auth
      summary: 'Destroy an authenticated session.'
      operationId: 250045954f07adf40103e33a04e5d715
      responses:
        '204':
          description: 'User successfully logged out.'
      security:
        -
          scalar: sessionAuth
  /api/redirect:
    get:
      tags:
        - github
        - auth
      operationId: 0487fbb4c6d40e317fb4ec45582d09e5
      responses:
        '302':
          description: 'Redirects to GitHub for authentication.'
        '400':
          description: 'GitHub client redirect not configured.'
  /api/callback:
    get:
      tags:
        - github
        - auth
      operationId: 34a24a8f777c83598c6c30936c6f9a04
      responses:
        '301':
          description: 'Redirects to the frontend URL after authentication.'
        '400':
          description: 'Error during GitHub authentication.'
  /api/register:
    post:
      tags:
        - auth
      summary: 'Handle an incoming registration request.'
      operationId: apiRegister
      requestBody:
        description: 'Create user model and login in user.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 'User successfully registered.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: 'Error with registering.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
  '/api/blocks/{project}/blocks':
    get:
      tags:
        - block
      summary: 'Display a listing of the resource.'
      operationId: 10eca818648caf716977d244ad606c5f
      parameters:
        -
          name: project
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'All blocks, 1 deep, project has.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Block'
        '404':
          description: 'Project not found.'
      security:
        -
          scalar: sessionAuth
  /api/blocks:
    post:
      tags:
        - block
      summary: 'Store a newly created resource in storage.'
      operationId: 1dd0ffd5fff7170b9eb63bc88abafb8e
      requestBody:
        description: 'Name to crate the project'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBlockRequest'
      responses:
        '204':
          description: 'Block created.'
      security:
        -
          scalar: sessionAuth
  '/api/blocks/{block}':
    get:
      tags:
        - block
      summary: 'Display the specified resource.'
      operationId: 620ba86a781f786819b86f7659a2ace8
      parameters:
        -
          name: block
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Return block by id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
        '404':
          description: 'Block not found.'
      security:
        -
          scalar: sessionAuth
    put:
      tags:
        - block
      summary: 'Update the specified resource in storage.'
      operationId: 6d6ed5337b57e93ccfc607d3ae3ead93
      parameters:
        -
          name: block
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        description: 'Data to update block.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBlockRequest'
      responses:
        '204':
          description: 'Block updated.'
        '401':
          description: Unauthenticated/Invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
    delete:
      tags:
        - block
      summary: 'Remove the specified resource from storage.'
      operationId: 78f914110185aacb3dee70019e5a6e6b
      parameters:
        -
          name: block
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 'Block deleted.'
      security:
        -
          scalar: sessionAuth
    patch:
      tags:
        - block
      operationId: cc10f4e526e45e01f129e6568eb2aff6
      parameters:
        -
          name: block
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        description: 'Data to update block.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBlockRequest'
      responses:
        '204':
          description: 'Block updated.'
        '401':
          description: Unauthenticated/Invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
  '/api/blocks/{block}/blocks':
    get:
      tags:
        - block
      summary: 'Display the specified resource childern.'
      operationId: c857e2bdf63b37450c516ae264893aae
      parameters:
        -
          name: block
          in: path
          required: true
          schema:
            type: interger
      responses:
        '200':
          description: 'All blocks, from blocks deep.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Block'
        '404':
          description: 'Project not found.'
      security:
        -
          scalar: sessionAuth
  /api/projects:
    get:
      tags:
        - project
      summary: 'Display a listing of the resource.'
      operationId: 8d4a13ef3fc773ff4031e515460919ea
      responses:
        '200':
          description: test
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
    post:
      tags:
        - project
      summary: 'Store a newly created resource in storage.'
      operationId: a4dd4c17bf5fc24c224357f03dcc848a
      requestBody:
        description: 'Name to crate the project'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProjectRequest'
      responses:
        '201':
          description: 'Project created successfully'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string }
                type: object
        '400':
          description: 'Invalid url'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorObject'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
  /api/projects/create:
    post:
      tags:
        - project
      summary: 'Store a newly created resource in storage.'
      operationId: 5dae9d6654a488de0a9e7fc0a8800669
      requestBody:
        description: 'Project data'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreClientProjectRequest'
      responses:
        '204':
          description: 'Project created successfully'
        '400':
          description: 'Invalid data.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorObject'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
  '/api/projects/{project}':
    get:
      tags:
        - project
      summary: 'Display the specified resource.'
      operationId: 1352e06e55f6ab10d3702509cd385918
      parameters:
        -
          name: project
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      security:
        -
          scalar: sessionAuth
    put:
      tags:
        - project
      summary: 'Update the specified resource in storage.'
      operationId: a93b65e3037bfd5ea5cdc1b3dd11ba53
      parameters:
        -
          name: project
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: 'Date to update project.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '204':
          description: 'Project updated.'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
    delete:
      tags:
        - project
      summary: 'Remove the specified resource from storage.'
      operationId: 63c289a907902132dd95dd7ecb50143f
      parameters:
        -
          name: project
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 'Project deleted.'
      security:
        -
          scalar: sessionAuth
    patch:
      tags:
        - project
      operationId: ee35632abc0168537257bd8f5baa9f30
      parameters:
        -
          name: project
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: 'Date to update project.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '204':
          description: 'Project updated.'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
  '/api/translations/{locale}/{module}':
    get:
      tags:
        - translation
      operationId: b890df2c0f1546a31de76aeaf6375924
      parameters:
        -
          name: locale
          in: path
          required: true
          schema:
            type: string
        -
          name: module
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LangObject'
        '404':
          description: 'Language/Module not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
        '422':
          description: 'Validation error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
  /api/user:
    get:
      tags:
        - user
      operationId: 971db9bc974c0e607288cfe7ecc10096
      responses:
        '200':
          description: 'User data.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
    put:
      tags:
        - user
      operationId: fd4f39f7820d3f3cbc259c5b30fed830
      requestBody:
        description: 'User data to update.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '204':
          description: 'User updated.'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
    delete:
      tags:
        - user
      operationId: db0c8ea1c902ed078a87cf1fa6497994
      requestBody:
        description: 'User password'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserRequest'
      responses:
        '204':
          description: 'User deleted.'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
    patch:
      tags:
        - user
      operationId: ea88adacb890b864b59bcce5aff2473d
      requestBody:
        description: 'User data to update.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '204':
          description: 'User updated.'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
  /api/user/style:
    put:
      tags:
        - user
      operationId: f8741720bfaafb5c8126e8c1418a9917
      requestBody:
        description: 'User style data to update.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStyleRequest'
      responses:
        '204':
          description: 'User style updated.'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
    patch:
      tags:
        - user
      operationId: 54ba995c0c13dd114980733de45f7ffa
      requestBody:
        description: 'User style data to update.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStyleRequest'
      responses:
        '204':
          description: 'User style updated.'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
  /api/user/password:
    put:
      tags:
        - user
      operationId: 57ddbc5bebe0cd30c268a0d8a4640660
      requestBody:
        description: 'User password to update.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '204':
          description: 'User password updated.'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
    patch:
      tags:
        - user
      operationId: 75f8f589d8162c3ebb0a27049232e804
      requestBody:
        description: 'User password to update.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '204':
          description: 'User password updated.'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
  /api/user/repos:
    get:
      tags:
        - user
      operationId: 395814df2599dc7a564535035ede73fb
      responses:
        '200':
          description: 'User repos from github.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
  '/api/user/repo/{name}':
    get:
      tags:
        - user
      operationId: 5dcb8b09ef61f0dd409ac3fbf1c59d74
      parameters:
        -
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Repos url.'
          content:
            application/json:
              schema:
                type:
                  - string
                  - 'null'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
      security:
        -
          scalar: sessionAuth
components:
  schemas:
    ErrorObject:
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: 'Validation failed.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              example: 'Field is required'
      type: object
    Lang:
      type: string
      enum:
        - lv
        - en
    PanelPosition:
      type: string
      enum:
        - top-left
        - top-right
        - top-center
        - bottom-left
        - bottom-center
        - bottom-right
    Themes:
      type: string
      enum:
        - light
        - dark
        - cupcake
        - bumblebee
        - emerald
        - corporate
        - synthwave
        - retro
        - cyberpunk
        - valentine
        - halloween
        - garden
        - forest
        - aqua
        - lofi
        - pastel
        - fantasy
        - wireframe
        - black
        - luxury
        - dracula
        - cmyk
        - autumn
        - business
        - acid
        - lemonade
        - night
        - coffee
        - winter
        - dim
        - nord
        - sunset
    VisibilityType:
      type: string
      enum:
        - private
        - public
      deprecated: true
    AuthTokenResponse:
      required:
        - message
        - token
      properties:
        message:
          type: string
          example: 'Login successful'
        token:
          description: 'Sanctum plain text API token'
          type: string
          example: 1|abcdefghijklmnopqrstuvwxyzabcdefg
      type: object
    RegisterRequest:
      required:
        - name
      allOf:
        -
          properties:
            name:
              type: string
          type: object
        -
          $ref: '#/components/schemas/LoginRequest'
    LangObject:
      type: object
      additionalProperties:
        oneOf:
          -
            type: string
          -
            $ref: '#/components/schemas/LangObject'
    LoginRequest:
      required:
        - email
        - password
        - remember
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        remember:
          type: boolean
          default: true
      type: object
    DeleteUserRequest:
      required:
        - password
      properties:
        password:
          type: string
          format: password
      type: object
    IndexProjectRequest:
      required:
        - name
      properties:
        name:
          type: string
      type: object
    StoreBlockRequest:
      required:
        - x
        - 'y'
        - width
        - height
        - path
        - content
      properties:
        x:
          type: integer
        'y':
          type: integer
        width:
          type: integer
        height:
          type: integer
        path:
          type: string
        content:
          type:
            - string
            - 'null'
      type: object
    StoreClientProjectRequest:
      required:
        - id
        - name
        - description
        - x
        - 'y'
        - zoom
        - default_branch
        - oid
        - cwd
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        x:
          type: integer
        'y':
          type: integer
        zoom:
          type: number
          format: float
        default_branch:
          type: string
        url:
          type: string
        oid:
          type: string
        cwd:
          type: string
      type: object
    StoreProjectRequest:
      required:
        - nameOrUrl
      properties:
        nameOrUrl:
          type: string
      type: object
    UpdateBlockRequest:
      required:
        - x
        - 'y'
        - width
        - height
        - path
        - content
      properties:
        x:
          type: integer
        'y':
          type: integer
        width:
          type: integer
        height:
          type: integer
        path:
          type: string
        content:
          type:
            - string
            - 'null'
      type: object
    UpdatePasswordRequest:
      description: 'Request to update user password'
      required:
        - oldpassword
        - newpassword
        - newPassword_confirmation
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
        newPassword_confirmation:
          type: string
          format: password
      type: object
    UpdateProjectRequest:
      required:
        - name
        - description
        - x
        - 'y'
        - zoom
      properties:
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        x:
          type: integer
        'y':
          type: integer
        zoom:
          type: number
          format: float
      type: object
    UpdateStyleRequest:
      $ref: '#/components/schemas/Style'
      description: 'Request for updating user style'
    UpdateUserRequest:
      description: 'Request to update user information'
      required:
        - name
        - email
        - password
        - settings
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type:
            - string
            - 'null'
          format: password
        settings:
          required:
            - lang
            - hideExtensions
            - defaultBranch
          properties:
            lang:
              type: string
              format: enum
              enum:
                - en
                - lv
            hideExtensions:
              type: boolean
            defaultBranch:
              type: string
              default: main
          type: object
      type: object
    Block:
      required:
        - id
        - x
        - 'y'
        - path
        - is_file
        - is_folder
      properties:
        id:
          type: integer
        x:
          type: integer
          default: 0
        'y':
          type: integer
          default: 0
        width:
          type: integer
          default: 0
        height:
          type: integer
          default: 0
        path:
          type: string
        is_file:
          type: boolean
        is_folder:
          type: boolean
        block_id:
          type:
            - integer
            - 'null'
        project_id:
          type: integer
      type: object
    Project:
      required:
        - id
        - name
        - description
        - x
        - 'y'
        - zoom
        - default_branch
        - url
        - oid
        - cwd
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        x:
          type: integer
          default: 0
        'y':
          type: integer
          default: 0
        zoom:
          type: number
          format: float
          default: 1
        default_branch:
          type: string
          default: main
        url:
          type: string
        oid:
          type: string
        cwd:
          type: string
          default: /
      type: object
    Keybinds:
      description: 'User keybinds'
      required:
        - quickCommand
      properties:
        quickCommand:
          type: string
          default: Control+p
      type: object
    Style:
      description: 'User style'
      required:
        - controlPosition
        - minimapPosition
        - pathPosition
        - baseLightTheme
        - baseDarkTheme
      properties:
        controlPosition:
          allOf:
            -
              $ref: '#/components/schemas/PanelPosition'
        minimapPosition:
          $ref: '#/components/schemas/PanelPosition'
        pathPosition:
          $ref: '#/components/schemas/PanelPosition'
        baseLightTheme:
          $ref: '#/components/schemas/Themes'
        baseDarkTheme:
          $ref: '#/components/schemas/Themes'
      type: object
    Settings:
      description: 'User settings.'
      required:
        - hideExtensions
        - defaultBranch
        - lang
        - style
        - keybinds
      properties:
        hideExtensions:
          type: boolean
          default: true
        defaultBranch:
          type: string
          default: master
        lang:
          type: string
          default: en
        style:
          $ref: '#/components/schemas/Style'
        keybinds:
          $ref: '#/components/schemas/Keybinds'
      type: object
    User:
      required:
        - name
        - email
        - settings
      properties:
        name:
          type: string
        email:
          type: string
        has_github:
          type: boolean
        is_admin:
          type: boolean
        settings:
          $ref: '#/components/schemas/Settings'
      type: object
  securitySchemes:
    sessionAuth:
      type: apiKey
      description: "This API uses session-based authentication. The session cookie is automatically handled by the \n            middleware, and clients do not need to include it in their requests."
      name: web_block_session
      in: cookie
      flows:
        implicit:
          authorizationUrl: /api/auth/redirect
          scopes:
            - read
            - write
